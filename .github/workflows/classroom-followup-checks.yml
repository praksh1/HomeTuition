name: Classroom follow-up checks
on:
  push:
    branches: [codex/classroom-followups-sep24]
permissions:
  contents: read
concurrency:
  group: classroom-followup-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classroom_ci
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/classroom_ci
      PGURL: postgres://postgres:postgres@127.0.0.1:5432/classroom_ci
      NODE_ENV: test
      SESSION_SECRET: classroom-ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run test
      - run: pnpm --filter @workspace/sikshya run test
      - run: pnpm --filter @workspace/sikshya run lint:design
      - run: pnpm run db:push
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/api-server run test:messages
      - run: pnpm --filter @workspace/api-server run test:class-chat
      - name: Class conversation fixtures and legacy schedule compatibility
        run: |
          set -euo pipefail
          PORT=8080 node artifacts/api-server/dist/index.mjs > /tmp/classroom-api.log 2>&1 &
          test_api_pid=$!
          trap 'kill "$test_api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then cat /tmp/classroom-api.log; exit 1; fi
            sleep 1
          done
          pnpm --filter @workspace/api-server run test:one-chat
          pnpm --filter @workspace/api-server run test:late-joiner
          pnpm --filter @workspace/api-server run test:teacher-leave
          pnpm --filter @workspace/api-server run test:monthly
      - run: pnpm --filter @workspace/api-server run test:floor
      - name: Install browser
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium
      - run: pnpm --filter @workspace/sikshya run test:floor-ui
      - run: pnpm --filter @workspace/sikshya run test:messages-ui
