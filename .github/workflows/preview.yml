# Puts a branch on a real URL so it can be looked at before it reaches anybody.
#
# The production workflow deploys on a push to `main` and has one target. That left no way to
# answer "can I see this before we merge it?" — a change was reviewed by merging it, or by
# somebody's description of it. For a non-technical owner who has been handed "it should work now"
# and found that it did not, a description is not review.
#
# Deliberately manual. It never runs on a push, so no branch reaches a URL by accident; the owner
# starts it from Actions -> Preview a branch -> Run workflow and picks the branch.
#
# It deploys the `preview` environment in `wrangler.jsonc`, which is a **separate Worker with a
# separate name**. It cannot overwrite the live site: a different Worker is a different deployment.
# Production still only changes on a push to `main`.
name: Preview a branch

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API the preview should talk to (baked in at build time, not read at run time)"
        required: false
        default: "https://hometuition-api-production.up.railway.app"

# One preview at a time. Two racing deploys of the same Worker is a coin toss over which wins.
concurrency:
  group: preview-web
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Metro keeps a coordinator and a transform worker and both inherit this, so their combined
      # ceiling has to fit under the runner's — see the deploy workflow.
      NODE_OPTIONS: --max-old-space-size=1024

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A preview that does not compile is not worth looking at, and this is cheap next to the
      # build. The full test gate deliberately stays on the production workflow: this exists to let
      # somebody *see* a change, not to certify it.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build the web app for the preview
        run: pnpm --filter @workspace/sikshya run build
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Stop if Cloudflare access is not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::No CLOUDFLARE_API_TOKEN, so there is nothing to deploy to."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under"
          echo "Settings -> Secrets and variables -> Actions, then run this again."
          exit 1

      - name: Deploy the preview Worker
        id: deploy
        run: npx --yes wrangler@4.124.0 deploy --env preview 2>&1 | tee /tmp/deploy.log

      # `wrangler deploy` succeeding only means files were uploaded. The URL is read back out of
      # wrangler's own output rather than guessed from a subdomain this workflow cannot know.
      - name: Say where the preview is
        run: |
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          if [ -z "$URL" ]; then
            echo "::warning::wrangler did not print a URL. Check the deploy step's output above."
            URL="(see the Deploy step output)"
          else
            for i in 1 2 3 4 5 6; do
              curl -sfL "$URL" -o /dev/null && { echo "The preview responded."; break; }
              echo "Not up yet; a CDN can serve the previous bundle for a few seconds. Retrying."
              sleep 10
            done
          fi
          {
            echo "### Preview ready"
            echo ""
            echo "**$URL**"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\`  ·  Commit: \`${{ github.sha }}\`"
            echo "Talking to: \`${{ inputs.api_url }}\`"
            echo ""
            echo "This is a separate Worker. The live site is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
