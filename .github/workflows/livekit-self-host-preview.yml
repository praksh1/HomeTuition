name: LiveKit self-host preview checks
on:
  push:
    branches: [codex/livekit-self-host-preview]
    paths: ['infra/livekit-preview/**', '.github/workflows/livekit-self-host-preview.yml']
  pull_request:
    paths: ['infra/livekit-preview/**', '.github/workflows/livekit-self-host-preview.yml']
permissions:
  contents: read
concurrency:
  group: livekit-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livekit_preview_ci
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/livekit_preview_ci
      PGURL: postgres://postgres:postgres@127.0.0.1:5432/livekit_preview_ci
      NODE_ENV: test
      SESSION_SECRET: disposable-preview-ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test infra/livekit-preview/preview.test.mjs
      - name: Validate the actual pinned VM images and config
        run: |
          set -euo pipefail
          bash -n infra/livekit-preview/previewctl.sh
          node infra/livekit-preview/generate.mjs --domain livekit-preview.fadko.example --turn-domain turn-preview.fadko.example
          bundle="$PWD/.local/livekit-preview/livekit-preview.fadko.example"
          docker compose -f "$bundle/compose.yaml" config --quiet
          docker compose -f "$bundle/compose.yaml" pull
          docker run --rm -v "$bundle/caddy.json:/etc/caddy.json:ro" livekit/caddyl4:v2.11.3 validate --config /etc/caddy.json
      - name: Install exact SFU version with checksum verification (failure is not a skip)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fadko-livekit"
          cd "$RUNNER_TEMP/fadko-livekit"
          curl --fail --location --retry 3 -O https://github.com/livekit/livekit/releases/download/v1.13.6/livekit_1.13.6_linux_amd64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/livekit/livekit/releases/download/v1.13.6/checksums.txt
          grep ' livekit_1.13.6_linux_amd64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf livekit_1.13.6_linux_amd64.tar.gz livekit-server
          chmod +x livekit-server
          "$RUNNER_TEMP/fadko-livekit/livekit-server" --version
          echo "LIVEKIT_SERVER_BIN=$RUNNER_TEMP/fadko-livekit/livekit-server" >> "$GITHUB_ENV"
      - run: node infra/livekit-preview/config-smoke.mjs
      - run: pnpm run db:push
      - run: pnpm --filter @workspace/api-server run build
      - name: Install test browser
        run: |
          npm install --global playwright
          npx playwright install --with-deps chromium
      - name: Existing real two-browser classroom media regression
        run: pnpm --filter @workspace/sikshya run test:livekit-live
      - name: Existing teacher-permission and reconnect regression
        run: |
          bash scripts/start-local-livekit-stack.sh
          pnpm --filter @workspace/sikshya run test:floor-live
      # Deliberately NO deployment, cloud credentials, production environment or private artifacts.
