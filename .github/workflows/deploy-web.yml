# Deploys the web app when main changes.
#
# The API has always redeployed itself — Railway watches the repo. The web app did not, so
# every fix needed a human to run three commands in the right folder, in the right shell, in
# the right order. That step failed in every way it could: a `git pull` that silently did not
# run, leaving a build of stale code that deployed perfectly and shipped nothing; a wrong API
# URL baked into the bundle; PowerShell rejecting the syntax in our own docs. None of those
# were mistakes about the product, and all of them cost real time.
#
# So the machine does it now. A push to main is the deploy.
name: Deploy the web app

on:
  push:
    branches: [main]
  # Also gives a button: Actions -> Deploy the web app -> Run workflow.
  workflow_dispatch:

# Two deploys racing would be a coin toss over which one wins.
concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  # Baked into the JavaScript at build time, not read at run time — a wrong value here ships a
  # site that cannot reach its backend, and nothing fails loudly when it does. See
  # .agents/memory/deploy-url-baked-in.md before changing it.
  EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-5a63.up.railway.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway database, so the notification tests can run against a real one. They cannot
    # be faked usefully: what broke before was not logic but wiring, and only a real request
    # through a real socket shows whether the wiring is there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hometuition_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Lifted out of `secrets` so the steps below can ask whether it is set. GitHub allows the
    # `secrets` context in a step's `with:` and `env:` but not in its `if:` — using it there is
    # a validation error that fails the run instantly, with no jobs and no log to read.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap, deterministic, and catches the whole class of "it compiled on my machine".
      # Nothing is deployed if this fails.
      - name: Check every package compiles
        run: pnpm run typecheck

      # Rules the whole product depends on, exercised without a database: what counts as a
      # class being over, and therefore whether a teacher may start another one.
      - name: Server rules
        run: pnpm --filter @workspace/api-server run test

      # Notifications broke in a way unit tests cannot see: nothing was wrong, the wiring was
      # simply absent — the app showed sample data it had invented on the device, and the
      # server never told anyone anything. So the next three steps run the real API against a
      # real database, and then the real built app in a real browser against that API.
      # See artifacts/api-server/scripts/notification-tests/README.md.
      - name: Start the API against a throwaway database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
          PORT: 8080
          NODE_ENV: test
        run: |
          set -euo pipefail
          pnpm run db:push
          pnpm --filter @workspace/api-server run build
          nohup node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "API up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never came up"
          cat /tmp/api.log
          exit 1

      - name: Notifications leave the server
        run: pnpm --filter @workspace/api-server run test:notifications

      # The half that was actually missing: the app never listened. Only a real browser
      # running the real bundle can show that it does. Built against the local API, so this
      # build is deliberately thrown away and the deploy build made fresh below.
      - name: Install a browser for the tests that need one
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium

      - name: Notifications reach the app
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          pnpm --filter @workspace/sikshya run build
          pnpm --filter @workspace/sikshya run test:notifications

      # Rebuilt pointing at the real API. The build script clears the bundler cache whenever
      # the API address changes, because Metro inlines it during transform and caches the
      # result without the value in the key — so without that, this step would happily reship
      # the localhost build above. That was reproduced deliberately before it was fixed.
      - name: Build the web app for deploy
        run: pnpm --filter @workspace/sikshya run build

      # The whiteboard is the product, and its failures are invisible in the code and obvious
      # on screen — so these drive the real board in a real browser and compare pixels.
      # See artifacts/sikshya/scripts/board-tests/README.md.
      # These block the deploy. They were non-blocking for one run while it was unknown
      # whether their timeouts held up on CI hardware, which is slower than the machine they
      # were written on; that run passed all twenty checks in 44 seconds, so a broken
      # whiteboard now stops the deploy rather than annotating it. If one ever fails for a
      # reason that is not a real regression, fix the test — do not restore this exemption.
      - name: Whiteboard tests
        run: pnpm --filter @workspace/sikshya run test:board

      # Until the Cloudflare token is added, everything above still runs — so the code is
      # checked and the whiteboard tested on every push — and the deploy simply waits, rather
      # than failing and showing a red cross nobody can act on.
      - name: Deploy is not set up yet
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::Checks passed, but nothing was deployed: the CLOUDFLARE_API_TOKEN"
          echo "::notice::secret is not set. Add it under Settings -> Secrets and variables ->"
          echo "::notice::Actions, and the next push will deploy by itself."

      # Wrangler is fetched here rather than run through cloudflare/wrangler-action, and it is
      # deliberately *not* a project dependency.
      #
      # The action installs wrangler itself when it cannot find one, and in a pnpm workspace
      # that means `pnpm add` at the root, which pnpm refuses without an explicit `-w`. The
      # deploy died there in one second. Adding wrangler to the workspace instead looked like
      # the tidy fix and is worse: its `workerd` dependency has a build script, pnpm blocks
      # those by default, and every `pnpm install` — including the owner's, on Windows — would
      # start failing with a prompt about approving build scripts.
      #
      # So it is fetched on demand, at a pinned version so a deploy is reproducible rather than
      # whatever CI resolves on the day. This is also exactly what DEPLOY.md documents.
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.124.0 deploy

      # `wrangler deploy` succeeding only means files were uploaded. This reads the API address
      # back out of the bundle the live site is actually serving, which is the check that would
      # have caught a wrong URL before anyone noticed logins failing. It retries, because a CDN
      # can keep serving the previous bundle for a few seconds and a red cross for that would
      # be a false alarm.
      - name: Confirm the live site is serving this build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -uo pipefail
          site="https://hometuition.praksh-dhakal.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            entry=$(curl -sSf "$site/" 2>/dev/null | grep -oE '_expo/static/js/web/entry-[A-Za-z0-9._-]+\.js' | head -1 || true)
            found=""
            if [ -n "$entry" ]; then
              found=$(curl -sSf "$site/$entry" 2>/dev/null | grep -oE 'https://[A-Za-z0-9.-]+\.up\.railway\.app' | sort -u | head -1 || true)
            fi
            if [ "$found" = "$EXPO_PUBLIC_API_URL" ]; then
              echo "Deployed and verified. Live bundle $entry points at $found"
              exit 0
            fi
            echo "attempt $attempt: bundle='${entry:-none}' api='${found:-none}' — waiting for the CDN"
            sleep 10
          done
          echo "::error::the live site is not serving a build that points at $EXPO_PUBLIC_API_URL"
          echo "::error::last seen: bundle='${entry:-none}' api='${found:-none}'"
          exit 1
