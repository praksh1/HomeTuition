# Deploys the web app when main changes.
#
# The API has always redeployed itself — Railway watches the repo. The web app did not, so
# every fix needed a human to run three commands in the right folder, in the right shell, in
# the right order. That step failed in every way it could: a `git pull` that silently did not
# run, leaving a build of stale code that deployed perfectly and shipped nothing; a wrong API
# URL baked into the bundle; PowerShell rejecting the syntax in our own docs. None of those
# were mistakes about the product, and all of them cost real time.
#
# So the machine does it now. A push to main is the deploy.
name: Deploy the web app

on:
  push:
    branches: [main]
  # Also gives a button: Actions -> Deploy the web app -> Run workflow.
  workflow_dispatch:

# Two deploys racing would be a coin toss over which one wins.
concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  # Baked into the JavaScript at build time, not read at run time — a wrong value here ships a
  # site that cannot reach its backend, and nothing fails loudly when it does. See
  # .agents/memory/deploy-url-baked-in.md before changing it.
  EXPO_PUBLIC_API_URL: https://workspaceapi-server-production-5a63.up.railway.app
  # Every database-backed integration script uses the same throwaway Postgres service. Keeping
  # this at job scope also covers the earliest notification and board suites.
  PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
  # Excalidraw's generated CSS is large enough that parallel Metro workers exhaust the
  # GitHub runner while transforming it. The process then disappears mid-progress with no
  # JavaScript error. One worker takes longer but stays inside the runner's memory limit.
  EXPO_EXPORT_MAX_WORKERS: "1"
  # Keep the single Metro process below the runner's operating-system limit as well. Without
  # this cap Node expands until the kernel kills Metro and its parent together, leaving no
  # stack trace or build error. A heap ceiling makes Node collect earlier and, if the bundle
  # ever truly needs more, fail with a useful diagnostic rather than silently disappearing.
  # Metro keeps a coordinator and a transform worker, and both inherit this value. Their
  # combined ceiling therefore needs to fit under the runner limit, not merely each process.
  NODE_OPTIONS: --max-old-space-size=1536

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The complete production gate now includes every database-backed integration suite,
    # followed by a fresh Metro export and the real-browser checks. On a clean GitHub runner
    # those server checks consume about 29 minutes, so the old 30-minute ceiling killed Metro
    # mid-build even though every completed test had passed. This is a ceiling, not a delay:
    # successful runs still finish as soon as the checks and deploy do.
    timeout-minutes: 60

    # A throwaway database, so the notification tests can run against a real one. They cannot
    # be faked usefully: what broke before was not logic but wiring, and only a real request
    # through a real socket shows whether the wiring is there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hometuition_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Lifted out of `secrets` so the steps below can ask whether it is set. GitHub allows the
    # `secrets` context in a step's `with:` and `env:` but not in its `if:` — using it there is
    # a validation error that fails the run instantly, with no jobs and no log to read.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap, deterministic, and catches the whole class of "it compiled on my machine".
      # Nothing is deployed if this fails.
      - name: Check every package compiles
        run: pnpm run typecheck

      # The design tokens, held to a baseline that may go down and never up.
      #
      # constants/colors.ts existed for a long time and was bypassed 468 times by hex written
      # straight into screens — which is how a token file stops being one. This fails only when
      # a file gets worse than it already is, so it catches new leaks without demanding the
      # whole backlog be cleared first.
      - name: Design tokens
        run: pnpm --filter @workspace/sikshya run lint:design

      # Rules the whole product depends on, exercised without a database: what counts as a
      # class being over, and therefore whether a teacher may start another one.
      - name: Server rules
        run: pnpm --filter @workspace/api-server run test

      # The app's own pure logic — currently how a search box treats spacing, which is why
      # "ram p rasa d" now finds Ram Prasad.
      - name: App rules
        run: pnpm --filter @workspace/sikshya run test

      # Notifications broke in a way unit tests cannot see: nothing was wrong, the wiring was
      # simply absent — the app showed sample data it had invented on the device, and the
      # server never told anyone anything. So the next three steps run the real API against a
      # real database, and then the real built app in a real browser against that API.
      # See artifacts/api-server/scripts/notification-tests/README.md.
      - name: Start the API against a throwaway database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
          PORT: 8080
          NODE_ENV: test
          # The heartbeat is 25s in production, which is right for real networks and far too
          # slow to wait out twice in CI. The tests prove the mechanism, not the number.
          WS_HEARTBEAT_MS: 3000
        run: |
          set -euo pipefail
          pnpm run db:push
          pnpm --filter @workspace/api-server run build
          nohup node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          # Written down so a later step can restart *this* process by its id. Matching on the
          # command line instead is how a kill ends up hitting something it was never aimed at.
          echo $! > /tmp/api.pid
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "API up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the API never came up"
          cat /tmp/api.log
          exit 1

      - name: Notifications leave the server
        env:
          HEARTBEAT_MS: 3000
        run: pnpm --filter @workspace/api-server run test:notifications

      # The size at which a shared picture stops reaching the class, and the size at which it
      # closes the teacher's board connection. Pinned down because a teacher hit both from an
      # iPhone and the app said nothing either time.
      - name: What the board does with a big picture
        run: pnpm --filter @workspace/api-server run test:board-limits

      # When a class may be started, and when a force-closed one stops blocking the next.
      # Both were reported from a real session: a teacher could start a class from days ago,
      # and a force-quit browser locked them out of starting anything else.
      # The door and the money, in both modes. Payment mode follows what is configured rather
      # than a flag, so the only way to test the mode that matters — a real provider wired up,
      # where nothing but a signed callback may settle a booking — is to run a second server
      # with one configured. That half had never been exercised.
      - name: Paying for a class
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:payments

          # A second instance, with a provider configured, on its own port.
          PAYMENT_WEBHOOK_SECRET=ci-only-webhook-secret PORT=8081 NODE_ENV=test \
            nohup node artifacts/api-server/dist/index.mjs > /tmp/api-gateway.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/api/healthz >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then echo "::error::the gateway-mode API never came up"; cat /tmp/api-gateway.log; exit 1; fi
            sleep 1
          done
          API_URL=http://127.0.0.1:8081 PAYMENT_WEBHOOK_SECRET=ci-only-webhook-secret \
            pnpm --filter @workspace/api-server run test:payments

      # What a review says and who it says it about. The second half is the one that needs a
      # server: anonymity that only covers the teacher's own screen is not anonymity, because
      # the same list is public — so it is checked from a signed-out reader, another student,
      # and the teacher, and none of them may be handed a name.
      - name: Reviews say what the student wrote, and not who wrote it
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:reviews

      # Moving a class, getting out of one, and the money that follows. Held to a higher
      # standard than the rest because every assertion here is about somebody's money: the
      # three shares have to add back to the price exactly, an odd price has to round the
      # student's way, and the same Drop tapped six times has to produce one refund and free
      # one seat. Two real bugs came out of writing it — a limit of five that let seven
      # through under load, and a class size of 0.5 that quietly became 1.
      - name: Moving a class, dropping a class, and the money
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:refunds

      # The fourth testing round's bugs, each pinned so it cannot come back. Three of them
      # chained: a teacher created a class in the past, it sat in Upcoming saying "Session
      # Expired", a student bought it, and the page told them their teacher was 2,279 minutes
      # late and offered a refund form for a lesson that was never going to happen.
      - name: A class in the past, and the Subscribe button
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:round

      # Does the student actually hear that their class moved, and the teacher that somebody
      # left? Each event twenty times over, watched down a real socket, because a notification
      # that arrives nineteen times out of twenty works every time you try it by hand and
      # fails for somebody else.
      - name: Notifications people are waiting on
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:alerts

      # Attaching a file, end to end. This is the feature that had never once worked - the
      # storage code was left over from Replit and asked a credential sidecar on
      # 127.0.0.1:1106 for a token, which does not exist on Railway. It runs against a
      # stand-in that verifies the AWS signature with its own implementation written from the
      # spec, so a pass means two independent implementations agree rather than that the URL
      # merely looks signed. It caught the content type not actually being signed, which the
      # code claimed it was.
      - name: Attaching a file
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: pnpm --filter @workspace/api-server run test:uploads

      # Sending a file in a message, and — the part that would have shipped broken — opening
      # it at the other end. GET /storage/file refuses by default and allows a fixed list of
      # cases; a recipient was not on it, so a photo produced a bubble the person could see and
      # a file that 403'd when they tapped it. It looked perfect from the sending side, because
      # the sender is the uploader. Every check here that matters signs in as the recipient.
      - name: A file sent in a message, and the person it was sent to opening it
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: pnpm --filter @workspace/api-server run test:messages

      # The same chat features everywhere, which is the owner's requirement: the class chat and
      # the monthly course chat now take files and reactions like the Messages tab. Two routes
      # with different rules about who may read, so both are covered — "similar features" that
      # reached only one of them is the half-finished state this catches. And the checks that
      # matter sign in as somebody who did not upload the file.
      - name: A file sent in a class conversation, and the class opening it
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: pnpm --filter @workspace/api-server run test:class-chat

      # Swapping the video provider. Daily.co is unlikely to survive the monthly tier's
      # economics, so the seam went in before anything was built on top of it. This starts the
      # real server twice — once on Daily, once on a provider that carries no video — and
      # checks every rule around the room behaves identically, moderator rights included.
      - name: The video provider can be swapped
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: pnpm --filter @workspace/api-server run test:video

      # The support desk. Half of this suite is spent trying to get in rather than on the
      # features once inside: a tool that can suspend accounts and reset passwords is one where
      # "who is allowed in here" has to be answered by the server on every request, not by
      # whichever screen the app happens to show.
      - name: The support desk and who may use it
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:admin

      # A reported problem, from filing it to reading the answer. The owner's complaint was
      # that "a user can create several hundred requests without knowing the status" — so this
      # checks both halves: that the limit refuses without writing anything, and that the
      # history behind a status is true, visible to the reporter, and cannot be rewritten
      # after a decision has been made.
      - name: A request can be followed from filing to answer
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:tickets

      # The upgrade the owner's own server has to survive. The live database has three ticket
      # statuses, none of the new columns and no history table, and nobody is going to run a
      # migration by hand on it — Railway redeploys on push and the server has to come up
      # regardless. This builds a database in exactly that shape, with a request already sitting
      # in it, and checks the boot guard brings it forward without that request being lost.
      - name: A live database can be upgraded without touching it
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          UPGRADE_PORT: "8091"
        run: pnpm --filter @workspace/api-server run test:upgrade

      # The support desk's own door. The half that cannot be unit-tested is the enforcement: a
      # forced password change that only the screen insists on is a suggestion, because the
      # token handed out at sign-in is a real token and anything that can send a request could
      # skip the screen. Every check that matters here goes straight at the API with that token
      # and expects to be refused.
      - name: An operator ID is issued, and buys nothing until its password is replaced
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:operators

      # One conversation per class, however it is reached. The chat inside a lesson used to be
      # broadcast and never stored, so anything said during a class vanished and got said again
      # in the class thread — two conversations about one lesson, neither complete. For a
      # monthly class the messages belong to the course, not to one of thirty daily rooms.
      - name: What is said in a lesson is kept, in one place
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:one-chat

      # What a student who joins a course late may read. Two rules that pull against each
      # other: a month of a class's conversation is other people's, but the things that always
      # matter — the timetable, the book to buy — have to survive the cut or every new student
      # asks again. Pinned messages are the exemption.
      - name: A late joiner reads from when they arrived, and the pins
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:late-joiner

      # A teacher who is going to be away. Nothing knew they were, so cover for a class they
      # missed could land on a day they will miss too — one absence becoming two, and a student
      # told to turn up for a class nobody will hold. Marking leave deliberately does not cancel
      # the classes inside it or excuse missing them; that is the parked partial-month question.
      - name: A make-up cannot be scheduled into a teacher's leave
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:teacher-leave

      # A class's own message thread, and the log of who did what. Both have to survive a
      # restart to be worth anything — a teacher's "running ten minutes late" and a refund
      # argued weeks later both depend on the words still being there — so this restarts the
      # server between writing and reading.
      - name: The class thread and the audit log
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          cat > /tmp/restart-api.sh <<'SH'
          #!/bin/bash
          set -euo pipefail

          # Run from the repo root, whatever called this.
          #
          # `pnpm --filter` runs the test with its working directory set to the *package*, so
          # the relative path below resolved to
          # artifacts/api-server/artifacts/api-server/dist/index.mjs and node exited before it
          # bound anything. Thirty seconds of health checks then reported "never came back up"
          # with no clue why, because the restart's output was being discarded — which is how
          # this went undiagnosed for three runs.
          cd "${GITHUB_WORKSPACE:-$(git rev-parse --show-toplevel)}"

          # Killed by its recorded id, never by matching its command line.
          #
          # `pkill -f` matches any process whose command line contains the pattern, which
          # includes whatever shell happens to be running a script that mentions it. This
          # project has a memory note about that exact trap, and a kill in CI that hits the
          # wrong thing is invisible until something downstream fails for no stated reason.
          if [ -f /tmp/api.pid ]; then
            kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          fi

          # Wait for the port to be free before starting the replacement, rather than assuming
          # a second is enough. A new process that dies instantly with EADDRINUSE looks exactly
          # like one that never started.
          for attempt in $(seq 1 30); do
            if ! curl -sf --max-time 1 http://127.0.0.1:8080/api/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          PORT=8080 NODE_ENV=test WS_HEARTBEAT_MS=3000 \
            nohup node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "the API never came back up. Its log:"; cat /tmp/api.log; exit 1
          SH
          chmod +x /tmp/restart-api.sh
          API_URL=http://127.0.0.1:8080 RESTART_CMD=/tmp/restart-api.sh \
            pnpm --filter @workspace/api-server run test:thread

      # Who was in the class, which is the evidence every refund rule in REFUNDS.md is argued
      # from. Only a real socket into a real database shows whether the classroom hub actually
      # writes any of it down — the arithmetic is covered by the unit tests above, the wiring
      # is not, and wiring is what has silently gone missing here before.
      - name: Who was actually in the class
        env:
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: API_URL=http://127.0.0.1:8080 pnpm --filter @workspace/api-server run test:attendance

      # A whiteboard has to survive the server restarting, and the only way to tell that from
      # a variable still being in scope is to actually restart it between writing and reading.
      # This matters more than it sounds: the API redeploys on every push, so shipping any
      # change during a lesson used to take its whiteboard with it, silently.
      - name: A whiteboard survives a restart
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
          SESSION_SECRET: ci-only-not-a-real-secret
        run: |
          set -euo pipefail
          cat > /tmp/restart-api.sh <<'RESTART'
          #!/bin/bash
          pkill -f "artifacts/api-server/dist/index.mjs" 2>/dev/null || true
          sleep 1
          cd "$GITHUB_WORKSPACE"
          PORT=8080 nohup node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/healthz >/dev/null && exit 0
            sleep 1
          done
          exit 1
          RESTART
          chmod +x /tmp/restart-api.sh
          API_URL=http://127.0.0.1:8080 RESTART_CMD=/tmp/restart-api.sh \
            pnpm --filter @workspace/api-server run test:board-persistence

      - name: When a class may be started
        env:
          # These tests age rows past the three-hour and two-minute windows rather than
          # waiting them out, so they need the database directly as well as the API.
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: pnpm --filter @workspace/api-server run test:sessions

      # The half that was actually missing: the app never listened. Only a real browser
      # running the real bundle can show that it does. Built against the local API, so this
      # build is deliberately thrown away and the deploy build made fresh below.
      - name: Install a browser for the tests that need one
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium

      # Both of these drive the real app against the local API, so they share one build of it.
      # That build is deliberately thrown away and the deploy build made fresh below.
      - name: The app against a real server
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
          # The classroom test ages a class past the three-hour window rather than waiting.
          PGURL: postgres://postgres:postgres@127.0.0.1:5432/hometuition_ci
        run: |
          set -euo pipefail
          pnpm --filter @workspace/sikshya run build
          pnpm --filter @workspace/sikshya run test:notifications
          # Tapping the card a teacher actually taps. This exists because a rule was fixed and
          # the screen that had to ask it was never touched: every test passed while tapping a
          # three-day-old class opened a classroom and asked the phone for its camera. A test
          # of a rule cannot see that; only this can.
          pnpm --filter @workspace/sikshya run test:classroom
          # Which tabs each role gets. Moving a screen out of a tab bar is the change that
          # quietly leaves it unreachable: the route still exists, everything compiles, and the
          # only way to find out is to open the app and try to get to it.
          pnpm --filter @workspace/sikshya run test:nav
          # Moving a class and dropping one, through the screens rather than the API. The
          # figures are read off the rendered page and out of the confirmation dialog, because
          # the number somebody agrees to lose is the number on their screen — not the one the
          # component was passed. It caught the Drop control being reachable but the class
          # thread vanishing for the student who had just used it.
          pnpm --filter @workspace/sikshya run test:refunds
          # Attaching a photo with the bucket refusing the direct upload — the live-site
          # failure. A browser will not PUT to R2 unless the bucket names the site's origin,
          # and reports the refusal as "Load failed" and nothing more. The app has to notice
          # and send the file through our own API instead.
          pnpm --filter @workspace/sikshya run test:uploads
          # The Nepali calendar, through the screens. The conversion is unit-tested; this is
          # whether a Nepali teacher can schedule a class without converting a date in their
          # head, and whether a student sees the date they recognise.
          pnpm --filter @workspace/sikshya run test:calendar
          # The dashboard, from a screenshot a teacher sent: classes from last week sitting in
          # "Upcoming" with a Start button that refuses when pressed, and every date Gregorian
          # for somebody whose whole app is in Bikram Sambat.
          pnpm --filter @workspace/sikshya run test:dashboard
          # Following a request through the screens. Reachability is the point: app/_layout.tsx
          # bounces a signed-in student off any screen not registered as shared, so a perfectly
          # correct screen can be unreachable — which is exactly what had happened to
          # "My Requests" before this suite caught it.
          pnpm --filter @workspace/sikshya run test:tickets
          # The Sessions screens with enough on them to crowd: ten classes to come, six that
          # came and went unstarted, one finished, and a monthly class. A filter checked
          # against three rows proves nothing, and monthly classes had no place on either
          # screen at all until this.
          pnpm --filter @workspace/sikshya run test:filters
          # The file-storage check, driven from the button rather than the endpoint. It
          # exists because the owner was told to open the endpoint in their phone's browser
          # and got "Missing or invalid Authorization header" — the only thing it could ever
          # have said, since this API takes a Bearer token the app holds and a browser tab
          # has none. A diagnostic nobody can run is not a diagnostic.
          pnpm --filter @workspace/sikshya run test:storage-check
          # Starting a conversation, which for a long time only one side could do. It belongs
          # in *this* step and not after the deploy build: down there EXPO_PUBLIC_API_URL is the
          # production URL, so the built app talks to Railway, never signs in with the local
          # token, and has no tab bar to click. Its API-level checks passed there and only the
          # browser half failed, which is exactly how that mistake hides.
          pnpm --filter @workspace/sikshya run test:messaging

      # Rebuilt pointing at the real API. The build script clears the bundler cache whenever
      # the API address changes, because Metro inlines it during transform and caches the
      # result without the value in the key — so without that, this step would happily reship
      # the localhost build above. That was reproduced deliberately before it was fixed.
      - name: Build the web app for deploy
        run: pnpm --filter @workspace/sikshya run build

      # The whiteboard is the product, and its failures are invisible in the code and obvious
      # on screen — so these drive the real board in a real browser and compare pixels.
      # See artifacts/sikshya/scripts/board-tests/README.md.
      # These block the deploy. They were non-blocking for one run while it was unknown
      # whether their timeouts held up on CI hardware, which is slower than the machine they
      # were written on; that run passed all twenty checks in 44 seconds, so a broken
      # whiteboard now stops the deploy rather than annotating it. If one ever fails for a
      # reason that is not a real regression, fix the test — do not restore this exemption.
      - name: Whiteboard tests
        run: pnpm --filter @workspace/sikshya run test:board

      # The same board at the size it is actually taught on. These exist because the board
      # looked right on a laptop while a teacher on an iPhone had no Selection tool at all —
      # it was rendered off the left edge of the screen. A desktop-sized test cannot see that.
      - name: Whiteboard on a phone
        run: pnpm --filter @workspace/sikshya run test:phone

      - name: A phone photo reaches the class
        run: pnpm --filter @workspace/sikshya run test:photo

      # The board with a processor slowed to roughly a budget Android's. Most numbers are
      # reported rather than asserted; this fails only if the board never becomes visible or
      # an incoming stroke takes longer than three seconds, which is breakage rather than
      # slowness. See artifacts/sikshya/scripts/perf-tests/README.md.
      - name: The whiteboard on a slow phone
        run: pnpm --filter @workspace/sikshya run test:perf

      # The class conversation lives inside the call now rather than behind a tab that hid the
      # video. This drives the real component in a real browser, including the state a student
      # on a bad connection lands in — where the call never comes up and chat is all they have.
      # See artifacts/sikshya/scripts/call-chat-tests/.
      - name: In-call chat
        run: pnpm --filter @workspace/sikshya run test:call-chat

      # What a "leave" from the video call is allowed to mean. Daily emits `left-meeting` when
      # a join *fails* as well as when someone hangs up, and the teacher's classroom ends the
      # class on a leave — so an unreachable room ended the lesson and threw the teacher out.
      # Invisible from a sandbox that cannot reach Daily at all; this run found it.
      - name: A failed call does not end the class
        run: pnpm --filter @workspace/sikshya run test:call-leave


      # Until the Cloudflare token is added, everything above still runs — so the code is
      # checked and the whiteboard tested on every push — and the deploy simply waits, rather
      # than failing and showing a red cross nobody can act on.
      - name: Deploy is not set up yet
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice::Checks passed, but nothing was deployed: the CLOUDFLARE_API_TOKEN"
          echo "::notice::secret is not set. Add it under Settings -> Secrets and variables ->"
          echo "::notice::Actions, and the next push will deploy by itself."

      # Wrangler is fetched here rather than run through cloudflare/wrangler-action, and it is
      # deliberately *not* a project dependency.
      #
      # The action installs wrangler itself when it cannot find one, and in a pnpm workspace
      # that means `pnpm add` at the root, which pnpm refuses without an explicit `-w`. The
      # deploy died there in one second. Adding wrangler to the workspace instead looked like
      # the tidy fix and is worse: its `workerd` dependency has a build script, pnpm blocks
      # those by default, and every `pnpm install` — including the owner's, on Windows — would
      # start failing with a prompt about approving build scripts.
      #
      # So it is fetched on demand, at a pinned version so a deploy is reproducible rather than
      # whatever CI resolves on the day. This is also exactly what DEPLOY.md documents.
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.124.0 deploy

      # `wrangler deploy` succeeding only means files were uploaded. This reads the API address
      # back out of the bundle the live site is actually serving, which is the check that would
      # have caught a wrong URL before anyone noticed logins failing. It retries, because a CDN
      # can keep serving the previous bundle for a few seconds and a red cross for that would
      # be a false alarm.
      - name: Confirm the live site is serving this build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -uo pipefail
          site="https://hometuition.praksh-dhakal.workers.dev"
          # The name the app should answer to, read from the file that decides it rather than
          # written out here, so a future rename does not need this step edited too.
          want_title=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/sikshya/app.json','utf8')).expo.web.name")
          for attempt in 1 2 3 4 5 6; do
            home=$(curl -sSf "$site/" 2>/dev/null || true)
            entry=$(printf '%s' "$home" | grep -oE '_expo/static/js/web/entry-[A-Za-z0-9._-]+\.js' | head -1 || true)
            title=$(printf '%s' "$home" | grep -oE '<title>[^<]*</title>' | sed -e 's|<title>||' -e 's|</title>||' || true)
            found=""
            if [ -n "$entry" ]; then
              found=$(curl -sSf "$site/$entry" 2>/dev/null | grep -oE 'https://[A-Za-z0-9.-]+\.up\.railway\.app' | sort -u | head -1 || true)
            fi
            if [ "$found" = "$EXPO_PUBLIC_API_URL" ] && [ "$title" = "$want_title" ]; then
              echo "Deployed and verified. Live bundle $entry points at $found, and the tab reads $title"
              exit 0
            fi
            echo "attempt $attempt: bundle='${entry:-none}' api='${found:-none}' title='${title:-none}' — waiting for the CDN"
            sleep 10
          done
          echo "::error::the live site is not serving the build this run produced"
          echo "::error::wanted api=$EXPO_PUBLIC_API_URL title=$want_title"
          echo "::error::last seen: bundle='${entry:-none}' api='${found:-none}' title='${title:-none}'"
          exit 1
